name: Bug report / 问题反馈
description: 报告可复现的问题，请使用脱敏或合成数据。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请勿上传真实会话日志、数据库、账号令牌或含个人信息的截图。
        安全漏洞请通过仓库 Security → Report a vulnerability 私密报告。
  - type: input
    id: version
    attributes:
      label: QuotaMate 版本
      placeholder: 0.1.21
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS 版本与芯片
      placeholder: macOS 15 / Apple Silicon
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: 数据源
      options:
        - GPT / Codex
        - Claude
        - 界面或其他功能
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 描述操作顺序、预期结果和实际结果，避免包含邮箱或项目真实路径。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏截图或最小示例（可选）
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 我已移除凭证、真实对话、邮箱和本机项目路径。
          required: true
